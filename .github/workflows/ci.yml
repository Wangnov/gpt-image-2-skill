# Pull-request quality gate.
#
# Every other workflow in this repo publishes or releases something; none of
# them run the test suites, so `vitest` and `cargo test` only ever ran locally.
# This workflow is the missing gate: it runs the same checks a maintainer would
# run by hand before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify workflow supply-chain policy
        run: scripts/security/check-workflows.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.6.0
          cache: npm
          cache-dependency-path: |
            apps/gpt-image-2-app/package-lock.json
            workers/gpt-image-2-relay/package-lock.json
      - name: Test skill bootstrap integrity
        run: node --test scripts/security/test-skill-wrapper.cjs
      - name: Test release workflow and updater compatibility channels
        run: node --test scripts/release/test-*.mjs
      - name: Audit npm dependencies
        run: |
          npm --prefix apps/gpt-image-2-app ci
          npm --prefix workers/gpt-image-2-relay ci
          npm --prefix apps/gpt-image-2-app audit --audit-level=high
          npm --prefix workers/gpt-image-2-relay audit --audit-level=high
          npm --prefix apps/gpt-image-2-app install-scripts ls --json | jq -e '.allowScripts | length == 0'
          npm --prefix workers/gpt-image-2-relay install-scripts ls --json | jq -e '.allowScripts | length == 0'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: |
          python3 scripts/security/check-dependency-mitigations.py
          cargo audit

  node:
    name: Node (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - apps/gpt-image-2-app
          - workers/gpt-image-2-relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.6.0
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.package }}
        run: npm ci
      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: npm run typecheck
      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

  native-keychain:
    name: Native keychain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify synthetic v3/v4 native credential compatibility
        run: cargo test -p gpt-image-2-core --test native_keychain --locked -- --ignored --exact native_v3_credentials_interoperate_with_v4

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # tauri_build::build() refuses to compile when frontendDist is missing.
      - name: Ensure frontend dist exists for tauri_build
        run: mkdir -p apps/gpt-image-2-app/dist
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test glib security backport with optimizations
        run: cargo test --manifest-path vendor/glib/Cargo.toml --release test_variant_str_iter
