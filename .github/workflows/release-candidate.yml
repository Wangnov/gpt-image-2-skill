name: Release Candidate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.6.0
          cache: npm
          cache-dependency-path: apps/gpt-image-2-app/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install AppImage build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 squashfs-tools
      - run: npm ci --prefix apps/gpt-image-2-app
      - name: Build AppImage candidate
        run: npm --prefix apps/gpt-image-2-app run tauri -- build --bundles appimage --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify final AppImage
        shell: bash
        run: |
          images=(target/release/bundle/appimage/*.AppImage)
          bash scripts/release/verify-appimage.sh "${images[0]}"

      - name: Retain AppImage candidate
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: appimage-candidate
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
          retention-days: 7

  candidate:
    # 与正式 Linux 发布及 AppImage 候选使用相同基线。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.6.0
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install cargo-dist
        run: scripts/release/install-cargo-dist.sh
      # tauri_build::build() refuses to compile when frontendDist is missing,
      # and the workspace-wide gates below compile the Tauri crate too.
      - name: Ensure frontend dist exists for tauri_build
        run: mkdir -p apps/gpt-image-2-app/dist
      - name: Prepare release candidate
        run: scripts/release/prepare.sh

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.6.0
          cache: npm
          cache-dependency-path: apps/gpt-image-2-app/package-lock.json
      - name: Install dependencies
        run: npm --prefix apps/gpt-image-2-app ci
      - name: Test
        run: npm --prefix apps/gpt-image-2-app run test
      - name: Build
        run: npm --prefix apps/gpt-image-2-app run build

  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.6.0
          cache: npm
          cache-dependency-path: workers/gpt-image-2-relay/package-lock.json
      - name: Install dependencies
        run: npm --prefix workers/gpt-image-2-relay ci
      - name: Type-check
        run: npm --prefix workers/gpt-image-2-relay run typecheck
      - name: Test
        run: npm --prefix workers/gpt-image-2-relay run test
