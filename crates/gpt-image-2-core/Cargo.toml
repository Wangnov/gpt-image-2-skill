[package]
name = "gpt-image-2-core"
version = "0.7.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "Shared runtime, config, provider, and history core for GPT Image 2."

[dependencies]
anyhow = "1.0.103"
base64 = "0.23.1"
clap = { version = "4.5.51", features = ["derive"] }
dirs = "7.0.0"
keyring = "4.2.0"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "ring", "rustls", "smtp-transport", "webpki-roots"] }
md-5 = "0.11.0"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "charset", "form", "http2", "json", "multipart", "query", "rustls-no-provider", "socks"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
tempfile = "3.23.0"
url = "2.5.7"

[features]
recovery-fault-injection = []

[target.'cfg(target_os = "macos")'.dev-dependencies]
keyring-legacy = { package = "keyring", version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
keyring-legacy = { package = "keyring", version = "3.6.3", features = ["windows-native"] }
