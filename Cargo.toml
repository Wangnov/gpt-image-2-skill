[workspace]
members = [
  "crates/gpt-image-2-core",
  "crates/gpt-image-2-runtime",
  "crates/gpt-image-2-skill",
  "crates/gpt-image-2-web",
  "apps/gpt-image-2-app/src-tauri",
]
resolver = "2"
exclude = ["vendor/glib"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Wangnov/gpt-image-2-skill"
homepage = "https://github.com/Wangnov/gpt-image-2-skill"
documentation = "https://github.com/Wangnov/gpt-image-2-skill#readme"
authors = ["Wangnov <48670012+Wangnov@users.noreply.github.com>"]

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
push = false
pre-release-commit-message = "release: {{version}}"
tag-message = "release: {{version}}"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Backport GHSA-wrw7-89jp-8q8g while Tauri uses GTK3/glib 0.18.
[patch.crates-io]
glib = { path = "vendor/glib" }
